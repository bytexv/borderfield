name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.source.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Select the signed APK source
        id: source
        env:
          HAS_KEYS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ -f release/Borderfield.apk ]; then
            echo "mode=staged" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEYS" = "true" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
          else
            echo "This tag has no staged APK or signing secrets. See the local release instructions in README.md." >> "$GITHUB_STEP_SUMMARY"
            echo "mode=manual" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: prepare
    if: needs.prepare.outputs.mode != 'manual'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android SDK 35 is installed
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ] || [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Use the locally signed APK
        if: needs.prepare.outputs.mode == 'staged'
        run: |
          mkdir -p build
          cp release/Borderfield.apk build/Borderfield.apk
      - name: Build and sign on the runner
        if: needs.prepare.outputs.mode == 'build'
        env:
          STORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          export KEYSTORE="$RUNNER_TEMP/borderfield.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$STORE_BASE64" | base64 --decode > "$KEYSTORE"
          VERSION_NAME="${RELEASE_TAG#v}" ./tools/build.sh
      - name: Verify the release identity and version
        run: ./tools/verify-release.sh "$RELEASE_TAG" build/Borderfield.apk
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" build/Borderfield.apk --verify-tag --title "Borderfield ${RELEASE_TAG#v}" --generate-notes
